services:
  db:
    image: postgres:16-alpine
    container_name: english-learning-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: english_user
      POSTGRES_PASSWORD: english_password
      POSTGRES_DB: english_learning

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U english_user -d english_learning"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: